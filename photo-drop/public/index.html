<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Drop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0e0e0e;
      color: #e0e0e0;
      min-height: 100vh;
    }

    .container {
      max-width: 940px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
    }

    header p {
      color: #666;
      font-size: 14px;
      margin-top: 4px;
    }

    /* Upload zone */
    .upload-zone {
      margin: 28px 0 36px;
      border: 2px dashed #2a2a2a;
      border-radius: 12px;
      padding: 44px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: rgba(255,255,255,0.01);
    }

    .upload-zone:hover,
    .upload-zone.drag {
      border-color: #5b8def;
      background: rgba(91,141,239,0.05);
    }

    .upload-zone .icon { font-size: 38px; margin-bottom: 8px; }
    .upload-zone .label { color: #888; font-size: 14px; }
    .upload-zone .label.uploading { color: #5b8def; }

    #file-input { display: none; }

    /* Gallery */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 10px;
    }

    .photo-card {
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      background: #1a1a1a;
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s;
    }

    .photo-card:hover img { transform: scale(1.04); }

    .photo-card .date-badge {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 18px 8px 6px;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      font-size: 11px;
      color: #bbb;
    }

    .empty {
      text-align: center;
      color: #444;
      font-size: 14px;
      padding: 40px 0;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s;
    }

    .lightbox.open { opacity: 1; visibility: visible; }

    .lightbox img {
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 8px;
      display: block;
    }

    .lightbox-inner { position: relative; }

    .lightbox-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 13px;
      color: #888;
    }

    .btn-delete {
      background: rgba(255,60,60,0.12);
      color: #ff6b6b;
      border: 1px solid rgba(255,60,60,0.25);
      border-radius: 6px;
      padding: 6px 16px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      transition: background 0.15s;
    }

    .btn-delete:hover { background: rgba(255,60,60,0.25); }

    .btn-close {
      position: absolute;
      top: -40px;
      right: 0;
      background: none;
      border: none;
      color: #888;
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Photo Drop</h1>
      <p>Upload photos. Everyone who visits can see them.</p>
    </header>

    <div class="upload-zone" id="upload-zone">
      <div class="icon">📷</div>
      <div class="label" id="upload-label">Drop photos here or click to browse</div>
      <input type="file" id="file-input" accept="image/*" multiple>
    </div>

    <div class="gallery" id="gallery"></div>
    <div class="empty" id="empty" style="display:none">No photos yet. Upload some!</div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-inner" id="lightbox-inner">
      <button class="btn-close" id="lb-close">&times;</button>
      <img id="lb-img" src="" alt="">
      <div class="lightbox-bar">
        <span id="lb-info"></span>
        <button class="btn-delete" id="lb-delete">Delete</button>
      </div>
    </div>
  </div>

  <script>
    const zone = document.getElementById("upload-zone");
    const input = document.getElementById("file-input");
    const label = document.getElementById("upload-label");
    const gallery = document.getElementById("gallery");
    const emptyMsg = document.getElementById("empty");
    const lightbox = document.getElementById("lightbox");
    const lbImg = document.getElementById("lb-img");
    const lbInfo = document.getElementById("lb-info");
    const lbDelete = document.getElementById("lb-delete");
    const lbClose = document.getElementById("lb-close");

    let currentFile = null;

    // Format date
    function fmt(ts) {
      return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    }

    // Format size
    function fmtSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    // Load photos
    async function loadPhotos() {
      try {
        const res = await fetch("/api/photos");
        const data = await res.json();
        if (!data.ok) return;
        renderGallery(data.photos);
      } catch (err) {
        console.error("Load error:", err);
      }
    }

    function renderGallery(photos) {
      gallery.innerHTML = "";
      emptyMsg.style.display = photos.length === 0 ? "block" : "none";
      photos.forEach((p) => {
        const card = document.createElement("div");
        card.className = "photo-card";
        card.innerHTML = `
          <img src="${p.url}" alt="${p.filename}" loading="lazy">
          <div class="date-badge">${fmt(p.ts)}</div>
        `;
        card.addEventListener("click", () => openLightbox(p));
        gallery.appendChild(card);
      });
    }

    // Upload
    async function uploadFiles(files) {
      if (!files || files.length === 0) return;
      label.textContent = "Uploading…";
      label.classList.add("uploading");

      const formData = new FormData();
      for (const f of files) {
        if (f.type.startsWith("image/")) formData.append("photos", f);
      }

      try {
        const res = await fetch("/api/upload", { method: "POST", body: formData });
        const data = await res.json();
        if (data.ok) loadPhotos();
      } catch (err) {
        console.error("Upload error:", err);
      }

      label.textContent = "Drop photos here or click to browse";
      label.classList.remove("uploading");
    }

    // Drag & drop
    zone.addEventListener("click", () => input.click());
    input.addEventListener("change", (e) => uploadFiles(e.target.files));

    zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("drag"); });
    zone.addEventListener("dragleave", () => zone.classList.remove("drag"));
    zone.addEventListener("drop", (e) => {
      e.preventDefault();
      zone.classList.remove("drag");
      uploadFiles(e.dataTransfer.files);
    });

    // Lightbox
    function openLightbox(photo) {
      currentFile = photo;
      lbImg.src = photo.url;
      lbInfo.textContent = `${photo.filename}  ·  ${fmtSize(photo.size)}  ·  ${fmt(photo.ts)}`;
      lightbox.classList.add("open");
    }

    lbClose.addEventListener("click", () => lightbox.classList.remove("open"));
    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) lightbox.classList.remove("open");
    });

    lbDelete.addEventListener("click", async () => {
      if (!currentFile) return;
      if (!confirm("Delete this photo?")) return;
      try {
        await fetch(`/api/photos/${currentFile.filename}`, { method: "DELETE" });
        lightbox.classList.remove("open");
        loadPhotos();
      } catch (err) {
        console.error("Delete error:", err);
      }
    });

    // Escape to close
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") lightbox.classList.remove("open");
    });

    // Init
    loadPhotos();
  </script>
</body>
</html>
